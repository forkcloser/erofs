# Seeded from limen's canonical ci.yaml and the project's own from there:
# `verify` and `gate` are the canonical shape, verbatim; the erofs-utils
# pieces (a build step in `verify`, plus `mkfs-windows`, `verify-windows-image`
# and `fuzz`) are this project's, and are INTERIM — see
# .github/scripts/build-erofs-utils.sh for why they exist and what retires
# them. Everything they add still answers to the canonical `gate`.
#
# Design: minimal GitHub glue around the same tooling every developer runs
# locally. The only marketplace action is GitHub's own checkout, pinned by
# commit SHA (a tag can be moved to malicious code; a SHA cannot). Everything
# else is pinned, checksum-verified shell: aqua installs the repo's tools at
# the versions aqua.yaml pins, and `just` runs the exact recipes a laptop
# runs — CI green means the same thing as local green, by construction.
# Deliberately absent: runner egress filtering — the available options are
# third-party actions, which this workflow avoids on principle.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# No default token permissions: each job states what it needs. This workflow
# only ever reads the repository — it cannot write code, releases, or
# packages even if a step is compromised.
permissions: {}

# A superseded run (new push to the same branch/PR) is cancelled, not raced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every run step is bash on every runner: without this, windows defaults to
# PowerShell, which never sees the git-bash environment setup-aqua prepares
# (the whole matrix is designed to run the recipes under git-bash). Explicit
# bash also means `-eo pipefail` everywhere, which the implicit linux/macos
# default lacks.
defaults:
  run:
    shell: bash

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Pinned images, not -latest: a runner bump is a reviewed change.
        # macOS is not redundant: its /bin/bash is 3.2, the portability floor
        # the shared recipes target. arm64 (ubuntu-24.04-arm, windows-11-arm)
        # and windows cover the rest of the supported release matrix — both
        # windows legs run the recipes under git-bash (native arm64 tools
        # where upstream ships them, Prism-emulated amd64 via aqua's
        # windows_arm_emulation where it does not).
        # These names are NOT the ruleset's required contexts — the `gate` job
        # below is, precisely so this list can change without touching any
        # repository's branch protection.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # Generous for the windows legs: those runners are markedly slower, and the
    # per-GOOS lint recipes now run three legs each.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not left behind in .git/config: nothing in this
          # workflow talks to GitHub after checkout.
          persist-credentials: false
          # Full history and refs: `just do lint commits` validates the commit
          # range against the PR's base branch, which a shallow clone lacks.
          fetch-depth: 0

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      - name: Install pinned tools
        # Link-only: the shims download each tool lazily on first use (and it
        # is verified against the committed aqua-checksums.json then), so a
        # job only ever pays for the tools its recipes actually run.
        run: aqua install --only-link

      - name: Lint
        run: just lint

      # INTERIM: the image-backed tests shell out to mkfs.erofs, which the
      # pinned toolchain cannot carry (no release binary to pin), so it is
      # built from source here — checksum-verified, patched, one script for
      # every job. Not on windows: no native build; the windows-2025 leg with
      # an image is `verify-windows-image` below, fed by a cross-compile. The
      # windows legs of this matrix run `just test` as-is, and `mkfs-info`
      # says so in the log: image tests skip themselves there.
      - name: Build erofs-utils (interim)
        if: runner.os != 'Windows'
        run: .github/scripts/build-erofs-utils.sh native

      - name: Test
        run: just test

  # INTERIM: cross-compile a static mkfs.erofs.exe so the windows leg below
  # can run the image-backed tests. Artifact upload/download are GitHub's own
  # actions, SHA-pinned — the same trust class as checkout — and go away with
  # the rest of the erofs-utils machinery.
  mkfs-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cross-compile mkfs.erofs for windows
        run: |
          exe=$(.github/scripts/build-erofs-utils.sh windows | tail -n 1)
          mkdir -p build/mkfs-windows
          cp "$exe" build/mkfs-windows/mkfs.erofs.exe

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mkfs-erofs-windows
          path: build/mkfs-windows/mkfs.erofs.exe
          if-no-files-found: error

  # INTERIM: the windows-2025 leg WITH an image. Same recipe as every other
  # leg — `just test` — with mkfs.erofs on PATH; the difference from the
  # canonical windows legs of `verify` is only that the image tests do not
  # skip. Windows-arm is not covered with an image (the cross build is
  # x86_64 and would run under emulation; not worth a leg for an interim).
  verify-windows-image:
    needs: [mkfs-windows]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: mkfs-erofs-windows
          path: build/mkfs-windows

      - name: Put mkfs.erofs on PATH
        run: |
          echo "$GITHUB_WORKSPACE/build/mkfs-windows" >> "$GITHUB_PATH"

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      - name: Install pinned tools
        run: aqua install --only-link

      - name: Test
        env:
          # mkfs.erofs uses TMPDIR for its temporaries; windows does not set it.
          TMPDIR: ${{ runner.temp }}
        run: |
          mkfs.erofs -V
          just test

  # INTERIM in its plumbing, permanent in intent: a short fuzz of every Fuzz*
  # target, once, on linux, with mkfs.erofs available (several targets round-
  # trip through it). The recipe is limen's `do::test::go::fuzz` (verdict by
  # crasher, hiccup retried once); only the erofs-utils build step is interim.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      - name: Install pinned tools
        run: aqua install --only-link

      - name: Build erofs-utils (interim)
        run: .github/scripts/build-erofs-utils.sh native

      # The generated corpus is what makes fuzzing cumulative: each run
      # starts from every interesting input earlier runs discovered rather
      # than from the seeds. Key on the fuzz test sources so a changed
      # target restarts its own corpus; restore-keys keep the rest. GitHub's
      # own action, SHA-pinned.
      - id: fuzzdir
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fuzzdir.outputs.dir }}
          key: fuzz-corpus-${{ runner.os }}-${{ hashFiles('**/*_fuzz_test.go') }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      - name: Fuzz
        run: just do test go fuzz

      # Surface crashers as artifacts: the log names the target, but the
      # input itself is what reproduces the bug locally.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: fuzz-crashers
          path: testdata/fuzz/
          if-no-files-found: ignore

  # The ONE required status check (see defaultRequiredChecks in
  # internal/github/audit.go). Branch protection names contexts as strings, so
  # requiring the matrix legs directly would bake this workflow's runner list
  # into every repository's ruleset — and a project whose matrix differs then
  # waits forever on checks that never report. This job collapses the matrix,
  # whatever its shape, to a single stable name: change the legs above freely,
  # the ruleset never moves.
  gate:
    needs: [verify, verify-windows-image, fuzz]
    # always(), and the result asserted explicitly. Without always() a failed
    # or cancelled dependency SKIPS this job instead of failing it, and a
    # skipped required check does not block a merge — branch protection that
    # quietly stops protecting. `needs.verify.result` is success only when
    # every matrix leg succeeded.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg succeeded
        env:
          # Via env, never interpolated into the script: the shell sees data,
          # not something the expression layer can rewrite into code.
          RESULT: ${{ needs.verify.result }}
          RESULT_WINDOWS_IMAGE: ${{ needs.verify-windows-image.result }}
          RESULT_FUZZ: ${{ needs.fuzz.result }}
        run: |
          printf 'verify: %s\n' "$RESULT"
          printf 'verify-windows-image: %s\n' "$RESULT_WINDOWS_IMAGE"
          printf 'fuzz: %s\n' "$RESULT_FUZZ"
          [ "$RESULT" = "success" ] && [ "$RESULT_WINDOWS_IMAGE" = "success" ] && [ "$RESULT_FUZZ" = "success" ]
