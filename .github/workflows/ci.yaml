# Seeded once by `limen fix`, then the project's own: limen never updates it.
# The shared lanes (verify on every platform, fuzz, tools) live in
# limen-verify.yaml, content-pinned and kept current by `limen fix`; this file
# calls them, adds the project's own jobs, and gates on all of them.
#
# `just test` fetches the pinned mkfs.erofs (the mkfs-erofs recipe), so the
# shared verify lanes run the image-backed tests on every platform. The one
# project job is the fuzz lane with that binary, since the shared fuzz lane
# runs the fuzz recipe alone and the targets that round-trip through
# mkfs.erofs skip themselves without it.
#
# Minimal glue: GitHub's own actions pinned by SHA, hermetic at .hermetic/hermetic.yaml's
# pins, `just` running the recipes a laptop runs. No third-party actions,
# hence no egress-filtering action either.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# No default token permissions: each job states what it needs. This workflow
# only ever reads the repository — it cannot write code, releases, or
# packages even if a step is compromised.
permissions: {}

# A superseded run (new push to the same branch/PR) is cancelled, not raced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit bash everywhere: windows defaults to PowerShell and never sees
# git-bash's environment; explicit bash also brings -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  limen:
    uses: farcloser/limen/.github/workflows/limen-verify.yaml@d5b713ec26861f47ece42575c46c90eb3599a201 # v0.27.0
    permissions:
      contents: read

  # The fuzz lane with mkfs.erofs, so the targets that round-trip through it
  # run. Its own corpus key: the shared lane's corpus was explored without an
  # image.
  fuzz-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic

      - name: Fetch the pinned mkfs.erofs
        run: just mkfs-erofs

      - id: fuzzdir
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fuzzdir.outputs.dir }}
          key: fuzz-image-corpus-${{ runner.os }}-${{ hashFiles('**/*_fuzz_test.go', '**/fuzz_test.go') }}
          restore-keys: |
            fuzz-image-corpus-${{ runner.os }}-

      - name: Fuzz
        run: just do test go fuzz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-image-crashers
          path: '**/testdata/fuzz/'
          if-no-files-found: ignore

  # The ONE required status check (defaultRequiredChecks in
  # internal/github/audit.go). Requiring the lanes by name would bake the
  # runner list into every ruleset; this job collapses them to one stable
  # name. A project job joins `needs` and the assertion below.
  gate:
    needs: [limen, fuzz-image]
    # always(), and the result asserted explicitly. Without always() a failed
    # or cancelled dependency SKIPS this job instead of failing it, and a
    # skipped required check does not block a merge — branch protection that
    # quietly stops protecting. `needs.limen.result` is success only when
    # every lane it ran succeeded: each verify leg, fuzz and tools. The fuzz
    # lane with the image is asserted alongside.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every lane succeeded
        env:
          # Via env, never interpolated into the script: the shell sees data,
          # not something the expression layer can rewrite into code.
          LIMEN: ${{ needs.limen.result }}
          FUZZ_IMAGE: ${{ needs.fuzz-image.result }}
        run: |
          printf 'limen: %s\n' "$LIMEN"
          printf 'fuzz-image: %s\n' "$FUZZ_IMAGE"
          [ "$LIMEN" = "success" ] && [ "$FUZZ_IMAGE" = "success" ]
