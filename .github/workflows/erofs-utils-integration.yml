# Inherited, and not yet folded into the limen pipeline.
#
# Everything here exists for one reason: the tests that read a real image shell
# out to mkfs.erofs, and erofs-utils is a C project distributed as source — it
# has no release binary aqua could pin, so `just test` under the hermetic PATH
# cannot reach it and every image-backed test skips itself. This workflow builds
# erofs-utils (patched) from source and runs the suite against it, on linux,
# macos, and — via a MinGW cross-compile — windows, plus the fuzz targets.
#
# Retiring it means giving the pinned toolchain an mkfs.erofs, after which these
# jobs become `just` recipes like any other and this file goes away. Until then
# ci.yaml ("ci") is the authority on everything that does NOT need an image, and
# this workflow covers only what it cannot.
#
# Deliberately absent: a lint job. ci.yaml runs `just lint` — the repo's pinned
# golangci-lint (aqua.yaml), its .golangci.yml, once per supported GOOS. The job
# that used to live here ran an action-supplied golangci-lint v2.1 against the
# same code, so the two could disagree about the same tree.
name: erofs-utils integration

on:
  push:
    branches: [main, ci-test]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  EROFS_UTILS_VERSION: v1.9.3

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25"
          cache: false

      - name: Install erofs-utils build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libz-dev liblz4-dev uuid-dev

      - name: Install erofs-utils build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config lz4

      - name: Build and install erofs-utils
        run: |
          curl -L https://github.com/erofs/erofs-utils/archive/refs/tags/${EROFS_UTILS_VERSION}.tar.gz | tar -xzf -
          cd erofs-utils-${EROFS_UTILS_VERSION#v}
          for p in "${GITHUB_WORKSPACE}"/.github/workflows/patches/erofs-utils/*.patch; do
            patch -p1 < "$p"
          done
          ./autogen.sh
          ./configure --enable-lz4
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          sudo make install
          mkfs.erofs -V

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v ./...

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: stable
          cache: false

      - name: Install erofs-utils build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libz-dev liblz4-dev uuid-dev

      - name: Build and install erofs-utils
        run: |
          curl -L https://github.com/erofs/erofs-utils/archive/refs/tags/${EROFS_UTILS_VERSION}.tar.gz | tar -xzf -
          cd erofs-utils-${EROFS_UTILS_VERSION#v}
          for p in "${GITHUB_WORKSPACE}"/.github/workflows/patches/erofs-utils/*.patch; do
            patch -p1 < "$p"
          done
          ./autogen.sh
          ./configure --enable-lz4
          make -j"$(nproc)"
          sudo make install
          mkfs.erofs -V

      - name: Fuzz
        run: |
          fuzz_time=10s
          # Build the test binary once to avoid repeated compilation per target.
          go test -c -o fuzz.test .
          cache_dir=$(go env GOCACHE)/fuzz
          for target in $(./fuzz.test -test.list 'Fuzz.*' 2>/dev/null | grep '^Fuzz'); do
            echo "::group::$target"
            ./fuzz.test -test.fuzz="^${target}\$" -test.fuzztime=$fuzz_time -test.timeout=180s -test.fuzzcachedir="$cache_dir" && echo "PASS: $target" || exit 1
            echo "::endgroup::"
          done

  cross-compile-mkfs-windows:
    name: Cross-compile mkfs.erofs for Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config mingw-w64

      - name: Cross-compile lz4 for Windows
        env:
          MINGW_HOST: x86_64-w64-mingw32
        run: |
          curl -L https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz | tar -xzf -
          cd lz4-1.10.0/lib
          make -j"$(nproc)" \
            CC=${MINGW_HOST}-gcc \
            AR=${MINGW_HOST}-ar \
            WINDRES=${MINGW_HOST}-windres \
            TARGET_OS=Windows \
            BUILD_STATIC=yes \
            BUILD_SHARED=no \
            CFLAGS="-O3 -DXXH_NAMESPACE=LZ4_"
          sudo make PREFIX=/usr/${MINGW_HOST} install

      - name: Cross-compile erofs-utils for Windows
        env:
          MINGW_HOST: x86_64-w64-mingw32
        run: |
          curl -L https://github.com/erofs/erofs-utils/archive/refs/tags/${EROFS_UTILS_VERSION}.tar.gz | tar -xzf -
          cd erofs-utils-${EROFS_UTILS_VERSION#v}

          # Install compat headers for MinGW
          sudo cp -r "${GITHUB_WORKSPACE}/.github/workflows/mingw-compat-headers"/* /usr/${MINGW_HOST}/include/

          # Apply Windows compatibility patches
          for p in "${GITHUB_WORKSPACE}"/.github/workflows/patches/erofs-utils/*.patch; do
            patch -p1 < "$p"
          done

          ./autogen.sh
          # PKG_CONFIG_LIBDIR (not _PATH): _PATH prepends to the host's
          # search dirs, so host .pc files leak into the cross build —
          # v1.9.3's libxml2 auto-probe found the runner's libxml-2.0.pc
          # and put -lxml2 on a link line no mingw library can satisfy.
          # _LIBDIR replaces the search path outright: only the mingw
          # sysroot (where the cross-compiled lz4 installs its .pc) is
          # visible, and every other auto-probe fails closed.
          PKG_CONFIG_LIBDIR=/usr/${MINGW_HOST}/lib/pkgconfig \
          ./configure \
            --host=${MINGW_HOST} \
            --disable-shared \
            --enable-lz4 \
            --without-zlib \
            --disable-lzma \
            --without-libzstd \
            --without-selinux \
            --without-uuid \
            --without-openssl \
            --without-libxml2 \
            --disable-fuse \
            --disable-debug \
            --disable-dependency-tracking \
            CFLAGS="-O2 -g -D_FILE_OFFSET_BITS=64" \
            LDFLAGS="-Wl,-Bstatic -static-libgcc -L/usr/${MINGW_HOST}/lib" \
            liblz4_LIBS="/usr/${MINGW_HOST}/lib/liblz4.a"

          make -j"$(nproc)" -C lib CPPFLAGS="-D_GNU_SOURCE -include posix_compat.h"
          make -j"$(nproc)" -C mkfs CPPFLAGS="-D_GNU_SOURCE -include posix_compat.h" LIBS="-llz4"

          ${MINGW_HOST}-strip mkfs/mkfs.erofs.exe

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mkfs-erofs-windows
          path: erofs-utils-*/mkfs/mkfs.erofs.exe

  test-windows:
    name: Build & Test (windows-latest)
    runs-on: windows-latest
    needs: cross-compile-mkfs-windows
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25"
          cache: false

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: mkfs-erofs-windows

      - name: Install mkfs.erofs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\bin"
          Copy-Item erofs-utils-*/mkfs/mkfs.erofs.exe "$env:USERPROFILE\bin\"
          "$env:USERPROFILE\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Verify mkfs.erofs
        shell: bash
        run: mkfs.erofs -V

      - name: Build
        run: go build ./...

      - name: Test
        env:
          # mkfs.erofs uses TMPDIR for temporary files; Windows doesn't set it
          TMPDIR: ${{ runner.temp }}
        run: go test -v ./...
