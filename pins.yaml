# The mkfs.erofs the image-backed tests run, and the fsck.erofs that reads
# their images back: forkcloser/testbin's build of erofs-utils, one archive
# per platform the tests run on, verified against testbin's release
# attestation (limen's book, tooling.md, "Pinned artifacts beyond aqua").
# The `mkfs-erofs` recipe fetches this host's and puts both on the tests'
# PATH. The archive is named for its platform alone, so a testbin release
# moves `version:` and nothing else, whatever erofs-utils it builds: which
# one that is, the recipe prints. The attestation is held to testbin's
# release workflow by name: a workflow renamed there fails the next refresh,
# closed.
pins:
  - name: mkfs-erofs-linux-amd64
    renovate: github-releases forkcloser/testbin
    version: 0.4.0
    url: https://github.com/forkcloser/testbin/releases/download/v${version}/erofs-linux-amd64.tar.gz
    verify: github-attestation forkcloser/testbin forkcloser/testbin/.github/workflows/release.yaml
    digest:
      version: 0.4.0
      source: 66a0f3cb129389c891af624439ef2676e03fe3db40b17b607013006dcba70ae2
      sha256: 1f49b71f3707963da83a4f1598a2faaf0408a85494478c3c4e4b1bad293b9ae8
