# The mkfs.erofs the image-backed tests run: forkcloser/testbin's build of
# erofs-utils, one archive per platform the tests run on, verified against
# testbin's release attestation (limen's book, tooling.md, "Pinned artifacts
# beyond aqua"). The `mkfs-erofs` recipe fetches this host's and puts it on
# the tests' PATH. The archive name carries erofs-utils' own version, so a
# testbin release that moves to a newer erofs-utils changes it: Renovate's
# bump of `version:` then fails the digest refresh, and the five urls move by
# hand with it. The attestation is verified at the owner's scope: the pinned
# limen passes a `owner/repo` argument as `--owner`, which gh refuses, so the
# repository scope waits for a limen that passes it as `--repo`.
pins:
  - name: mkfs-erofs-linux-amd64
    renovate: github-releases forkcloser/testbin
    version: 0.2.0
    url: https://github.com/forkcloser/testbin/releases/download/v${version}/erofs-1.9.4-linux-amd64.tar.gz
    verify: github-attestation forkcloser
    digest:
      version: 0.2.0
      sha256: e5c0c9d0e4870f51187f564556e8fcc47ecdc5321ca4460fa086eaf19c03f1f7
  - name: mkfs-erofs-linux-arm64
    renovate: github-releases forkcloser/testbin
    version: 0.2.0
    url: https://github.com/forkcloser/testbin/releases/download/v${version}/erofs-1.9.4-linux-arm64.tar.gz
    verify: github-attestation forkcloser
    digest:
      version: 0.2.0
      sha256: f3aa8f5f3af8ae567705f98e44c2b7914d0bb08f7997330b84c96536725c09bc
