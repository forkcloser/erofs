# This project's carve-outs from the Go lint baseline (.limen/lint-go.yaml):
# the baseline's sections, in its shape, holding only what this project adds,
# changes or takes out (book/per-language.md, "one baseline, per-project
# carve-outs"). `just do lint go` renders the two on every run.
golangci:
  linters:
    disable:
      # An image is written and read through a handful of objects, each
      # named the way the format and io/fs name it: e for the entry being
      # laid out, fi for the inode being read, f for the open file, de, xe
      # and xh for a dirent, an xattr entry and its header, sb for the
      # superblock, bn for a block number. A function is about one of them,
      # and is long because it walks the on-disk layout field by field;
      # spelled out, the name prefixes every line and says nothing more.
      # forkcloser/xz disables it for its codec on the same grounds.
      - varnamelen
    exclusions:
      rules:
        # internal/erofstest is test support, compiled into tests only: its
        # numbers are fixture data (sizes, counts, modes), what mnd already
        # leaves alone in a _test.go file.
        - path: ^internal/erofstest/
          linters:
            - mnd
    settings:
      wrapcheck:
        # A list here replaces wrapcheck's own, so its defaults come first.
        ignore-sigs:
          - .Errorf(
          - errors.New(
          - errors.Unwrap(
          - errors.Join(
          - .Wrap(
          - .Wrapf(
          - .WithMessage(
          - .WithMessagef(
          - .WithStack(
          # The image's io.ReaderAt and the destination io.Writer are the
          # caller's: their errors go back untouched, and io.EOF comes back
          # as io.EOF, which readers compare with ==. erofs's own failures
          # are already classified (ErrInvalid and the errors built on it).
          - .Read(
          - .ReadAt(
          - .Write(
          - .WriteTo(
          - .WriteHeader(
          - .Seek(
          - io.ReadFull(
          - io.Copy(
          - io.WriteString(
          # WalkDir returns what the walk function returned, which is this
          # package's own error, or the source fs.FS's *PathError.
          - fs.WalkDir(
        ignore-package-globs:
          # This module's own packages: their errors already say what they
          # refuse.
          - github.com/forkcloser/erofs
          - github.com/forkcloser/erofs/*
          # os errors are *PathError and *LinkError: the operation and the
          # path are already in them.
          - os

nilaway:
  exclude-errors-in-files:
    # Slicing the result of a ReadDir whose error the fuzz target deliberately
    # ignores: a nil slice bounded by min(len, 16) cannot panic. NilAway has no
    # per-line directive, so the whole file is excluded.
    - erofs_fuzz_test.go
