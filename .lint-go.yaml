# This project's carve-outs from the Go lint baseline (.limen/lint-go.yaml):
# the baseline's sections, in its shape, holding only what this project adds,
# changes or takes out (book/per-language.md, "one baseline, per-project
# carve-outs"). `just do lint go` renders the two on every run.
golangci:
  linters:
    exclusions:
      rules:
        # ONBOARDING BACKLOG (book/mandatory-files.md, "onboarding an existing
        # repository"): the findings limen v0.7.2's baseline reports on code that
        # predates it, not yet read. Not a judgment: each entry is a linter and
        # the files it fires in, to be emptied one linter or one package per
        # pull request, and the block deleted with the last one.
        - path: ^(mkfs_remove_test\.go)$
          linters: [dupl]
        - path: ^(mkfs_untrusted_test\.go)$
          linters: [embeddedstructfieldcheck]
        - path: ^(erofs_directread_test\.go|erofs_fuzz_test\.go|perf_audit_test\.go)$
          linters: [errorlint]
        - path: ^(format\.go)$
          linters: [exhaustive]
        - path: ^(erofs\.go|internal/erofstest/tar\.go|mkfs\.go)$
          linters: [funcorder]
        - path: ^(erofs\.go|internal/erofstest/testcase\.go|layout\.go|mkfs\.go|mkfs_image\.go|writer\.go|xattr\.go)$
          linters: [gocognit]
        - path: ^(erofs\.go|internal/erofstest/testcase\.go|layout\.go|mkfs\.go|writer\.go)$
          linters: [gocritic]
        - path: ^(cmd/erofs\-cli/main\.go|erofs\.go|format\.go|internal/erofstest/convert\.go|internal/erofstest/fsck\.go|internal/erofstest/testcase\.go|layout\.go|mkfs\.go|mkfs_image\.go|writer\.go|xattr\.go)$
          linters: [gosec]
        - path: ^(erofs\.go|mkfs_image\.go|xattr\.go)$
          linters: [intrange]
        - path: ^(erofs\.go|internal/disk/ftypes\.go|internal/erofstest/tar\.go|internal/erofstest/testcase\.go|layout\.go|mkfs\.go|mkfs_image\.go|writer\.go|xattr\.go)$
          linters: [mnd]
        - path: ^(erofs\.go|mkfs_remove_test\.go)$
          linters: [modernize]
        - path: ^(mkfs_image\.go)$
          linters: [nilnil]
        - path: ^(bench_test\.go|erofs_loadat_test\.go|erofs_test\.go|internal/erofstest/fsck\.go|internal/erofstest/mkfs\.go|mkfs_chunkmap_test\.go|mkfs_limits_test\.go)$
          linters: [noctx]
        - path: ^(chunk_xattr_test\.go|erofs_directread_test\.go|erofs_fsconform_test\.go|erofs_loadat_test\.go|erofs_test\.go|format_test\.go|internal/disk/types_test\.go|mkfs_chunkmap_test\.go|mkfs_copy_test\.go|mkfs_limits_test\.go|mkfs_link_test\.go|mkfs_openfile_test\.go|mkfs_remove_test\.go|mkfs_test\.go|mkfs_untrusted_test\.go|perf_audit_test\.go)$
          linters: [paralleltest]
        - path: ^(erofs_directread_test\.go|erofs_fsconform_test\.go|erofs_loadat_test\.go|format_test\.go|internal/disk/types_test\.go|mkfs_chunkmap_test\.go|mkfs_limits_test\.go|mkfs_openfile_test\.go|mkfs_untrusted_test\.go|perf_audit_test\.go)$
          linters: [testpackage]
        - path: ^(erofs_fuzz_test\.go|erofs_test\.go|internal/erofstest/testcase\.go)$
          linters: [usetesting]
        - path: ^(cmd/erofs\-cli/main\.go|erofs\.go|format\.go|internal/disk/ftypes\.go|internal/erofstest/check\.go|internal/erofstest/fsck\.go|internal/erofstest/mkfs\.go|internal/erofstest/tar\.go|internal/erofstest/testcase\.go|layout\.go|mkfs\.go|mkfs_image\.go|writer\.go|xattr\.go)$
          linters: [varnamelen]
        - path: ^(cmd/erofs\-cli/main\.go|erofs\.go|internal/erofstest/tar\.go|mkfs\.go|mkfs_image\.go|writer\.go)$
          linters: [wrapcheck]

nilaway:
  exclude-errors-in-files:
    # Slicing the result of a ReadDir whose error the fuzz target deliberately
    # ignores: a nil slice bounded by min(len, 16) cannot panic. NilAway has no
    # per-line directive, so the whole file is excluded.
    - erofs_fuzz_test.go
